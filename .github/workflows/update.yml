name: 自动检测并替换失效源

on:
  schedule:
    - cron: '0 23 * * *'   # 每天 UTC 23:00 = 北京时间 07:00
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # 需要获取最近两次提交，以便比较文件变化

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 运行替换脚本
        run: python replace.py

      - name: 提交更新（如果有变更）
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "自动更新失效源 $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 检查 playlist.m3u 是否在本次提交中被修改
        id: check_playlist
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^playlist.m3u$"; then
            echo "playlist_changed=true" >> $GITHUB_OUTPUT
          else
            echo "playlist_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: 部署到 Cloudflare Pages（仅当 playlist.m3u 有变更时）
        if: steps.check_playlist.outputs.playlist_changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}
